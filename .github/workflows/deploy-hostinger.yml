name: Deploy to Hostinger

# Auto-deploys the site to Hostinger shared hosting on every push to the
# production branch. It builds the static export (out/), copies the
# .htaccess in alongside it, then uploads everything to public_html via FTP.
#
# Required GitHub secrets (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    - Hostinger FTP hostname (e.g. ftp.yourdomain.com or an IP)
#   FTP_USERNAME  - Hostinger FTP username
#   FTP_PASSWORD  - Hostinger FTP password
#
# Optional GitHub variables (same page, "Variables" tab):
#   SITE_URL      - live domain, defaults to https://civic-tobacco-machinery.com
#   FTP_SERVER_DIR- target folder on the server, defaults to public_html/
#     (some Hostinger FTP accounts are already scoped inside public_html;
#      if so, set this to ./ )

on:
  push:
    branches:
      - main
      - master
      - claude/sweet-heisenberg-qlvxuw
  workflow_dispatch: # lets you trigger a deploy manually from the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          EXPORT_STATIC: "1"
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://civic-tobacco-machinery.com' }}
        run: npm run build

      - name: Copy .htaccess into the export
        run: cp deploy/.htaccess out/.htaccess

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          # Keep files the deploy manages in sync; don't touch anything you
          # upload manually outside of it.
          dangerous-clean-slate: false
