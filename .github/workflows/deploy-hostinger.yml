name: Deploy to Hostinger

# Builds the static site and uploads it to Hostinger over FTPS on every
# push to the production branch. Because the /admin CMS commits posts to
# this branch, publishing a post automatically triggers a deploy.
#
# Required GitHub secrets (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    - Hostinger FTP hostname or IP (no ftp://, no port)
#   FTP_USERNAME  - Hostinger FTP username
#   FTP_PASSWORD  - Hostinger FTP password
#
# Optional GitHub variables:
#   SITE_URL       - live domain, defaults to https://civic-tobacco-machinery.com
#   FTP_SERVER_DIR - target folder, defaults to the absolute path /public_html/.
#                    This FTP account logs in inside public_html but its
#                    absolute root (/) is the account home, so an absolute
#                    server-dir keeps uploads AND deletions pointing at the same
#                    real web root (a relative ./ made deletions target /_next
#                    at the home root and fail with 550).

on:
  push:
    branches:
      - main
      - master
      - claude/sweet-heisenberg-qlvxuw
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          EXPORT_STATIC: "1"
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://civic-tobacco-machinery.com' }}
        run: npm run build

      - name: Copy .htaccess into the export
        run: cp deploy/.htaccess out/.htaccess

      - name: Deploy to Hostinger via lftp (FTPS)
        # lftp mirror uploads/updates the site's files. It deliberately does
        # NOT use --delete: public_html may also hold other apps the owner
        # uploaded manually (e.g. an HRM tool), and a delete-mirror would wipe
        # anything not in this repo. Without --delete the deploy only adds and
        # updates the website's own files and never removes unrelated content.
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_SERVER_DIR || '/public_html/' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp
          lftp -u "$FTP_USERNAME" --env-password "$FTP_SERVER" -e "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            set net:timeout 30;
            set net:persist-retries 3;
            mirror --reverse --parallel=3 --verbose ./out/ '$FTP_DIR';
            bye
          "
